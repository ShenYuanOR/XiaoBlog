<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
      }
      .box {
        position: absolute;
        width: 120px;
        height: 120px;
      }
      #a {
        left: 16px;
        top: 16px;
        background: #c33;
      }
      #b {
        left: 48px;
        top: 48px;
        background: #36c;
      }
    </style>
  </head>
  <body>
    <div class="box" id="a">甲</div>
    <div class="box" id="b">乙</div>
  </body>
</html>
