appId: site.xiaoblog.spike.electron-astro
productName: XiaoSpike
executableName: XiaoSpike
directories:
  output: release
files:
  - out
  - package.json
asar: true
extraResources:
  - from: resources/shim
    to: shim
  - from: resources/staged/template
    to: template
  - from: resources/staged/pnpm
    to: pnpm
  - from: resources/staged/pnpm-store.tar.zst
    to: pnpm-store.tar.zst
  - from: resources/staged/guides
    to: guides
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
npmRebuild: false
