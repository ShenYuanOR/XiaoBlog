appId: app.xiao.studio
productName: 晓
directories:
  output: release
files:
  - out/**
  - package.json
npmRebuild: false
electronDist: node_modules/electron/dist
asarUnpack:
  - "**/*.node"
extraResources:
  - from: resources/preview.config.mjs
    to: preview.config.mjs
  - from: resources/xiao-loc.mjs
    to: xiao-loc.mjs
electronFuses:
  runAsNode: true
win:
  target:
    - dir
